{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competidores</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <table>
        <tr><th>Nombre</th><th>Centro</th><th>Categoria</th></tr>
        {% for c in competidores %}
        <tr><td>{{ c.nombre }}</td><td> {{ c.centro }}</td><td> {{ c.categoria }}</td></tr>
        {% endfor %}
    </table>
</body>
</html>
